---
# Pulls the MongoDB password from Bitwarden Secrets Manager into the `mongo`
# k8s Secret (name must match the pod's envFrom). Uses the cluster-wide
# ClusterSecretStore 'bitwarden-login'.
#
# REQUIRED Bitwarden key (create in the BSM project the store points at):
#   MONGODB_PASSWORD
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mongo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-login
    kind: ClusterSecretStore
  target:
    name: mongo
  data:
    - secretKey: MONGODB_PASSWORD
      remoteRef:
        key: MONGODB_PASSWORD

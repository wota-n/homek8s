---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vocard
spec:
  interval: 1m
  path: ./kubernetes/apps/vocard/vocard/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
      - name: vocard
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: vocard
  wait: false

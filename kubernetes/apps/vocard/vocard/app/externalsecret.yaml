---
# Pulls the vocard bot credentials from Bitwarden Secrets Manager into the
# `vocard` k8s Secret. Flux's postBuild.substituteFrom on this app's ks.yaml
# reads this Secret, so settings.json's ${VOCARD_*} placeholders resolve from
# BSM — nothing secret is committed.
#
# REQUIRED Bitwarden keys (same BSM project as the other apps):
#   VOCARD_MONGODB_URL   full mongodb:// URI (e.g. mongodb://vocard:<pw>@mongo.vocard.svc:27017/vocard)
#   VOCARD_TOKEN         Discord bot token (create when reusing the old bot)
#   VOCARD_CLIENT_ID     Discord bot numeric client/app ID
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vocard
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-login
    kind: ClusterSecretStore
  target:
    name: vocard
  data:
    - secretKey: VOCARD_MONGODB_URL
      remoteRef:
        key: VOCARD_MONGODB_URL
    - secretKey: VOCARD_TOKEN
      remoteRef:
        key: VOCARD_TOKEN
    - secretKey: VOCARD_CLIENT_ID
      remoteRef:
        key: VOCARD_CLIENT_ID

---
# Lavalink v4 audio node. Image ENTRYPOINT is `java -jar Lavalink.jar` with
# WorkingDir /opt/Lavalink, so no command/args override is needed.
# LAVALINK_SERVER_PASSWORD (ESO) overrides server.password and SERVER_PORT pins
# the port, since the bundled default is 8080. The git-managed
# application.yml mounted at /opt/Lavalink/application.yml disables the broken
# built-in YouTube source and registers the youtube-source plugin. The bot
# resolves this pod as `lavalink:2333` via the ClusterIP Service.
apiVersion: v1
kind: Pod
metadata:
  name: lavalink
  labels:
    k8s-app: lavalink
spec:
  containers:
    - name: lavalink
      image: ghcr.io/lavalink-devs/lavalink:latest@sha256:87ae53e60dc147c9dddb28e126ce503a26bc8d1477ed8d99543614677882afff
      imagePullPolicy: IfNotPresent
      env:
        - name: _JAVA_OPTIONS
          value: -Xmx512m
        # Lavalink's bundled application.yml defaults to port 8080; the bot
        # dials lavalink:2333 (and the Service targets 2333), so pin the port
        # explicitly.
        - name: SERVER_PORT
          value: "2333"
        - name: LAVALINK_SERVER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: lavalink
              key: LAVALINK_PASSWORD
      # Git-managed application.yml: disables the broken built-in YouTube
      # source and registers the youtube-source plugin. Lavalink reads
      # /opt/Lavalink/application.yml in preference to the image's copy.
      volumeMounts:
        - name: application
          mountPath: /opt/Lavalink/application.yml
          subPath: application.yml
          readOnly: true
      startupProbe:
        tcpSocket:
          port: lavalink
        timeoutSeconds: 30
        periodSeconds: 10
        failureThreshold: 30
      ports:
        - name: lavalink
          containerPort: 2333
      resources:
        requests:
          memory: 512Mi
          cpu: 100m
        limits:
          memory: 1Gi
  volumes:
    - name: application
      configMap:
        name: lavalink-application

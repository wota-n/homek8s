---
# Lavalink password. The pod reads it from the `lavalink` Secret via env
# (LAVALINK_SERVER_PASSWORD overrides the bundled application.yml), so the
# value never lands in git. Must match the bot's
# settings.json -> nodes.DEFAULT.password.
#
# REQUIRED Bitwarden keys (create in the BSM project the store points at):
#   LAVALINK_PASSWORD
#   YOUTUBE_OAUTH_REFRESH_TOKEN   (burner Google account; see application.yml)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lavalink
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-login
    kind: ClusterSecretStore
  target:
    name: lavalink
  data:
    - secretKey: LAVALINK_PASSWORD
      remoteRef:
        key: LAVALINK_PASSWORD
    - secretKey: YOUTUBE_OAUTH_REFRESH_TOKEN
      remoteRef:
        key: YOUTUBE_OAUTH_REFRESH_TOKEN

# Lavalink configuration, shipped from git so the app is reproducible.
# Mounted at /opt/Lavalink/application.yml — Lavalink reads this path in
# preference to the copy bundled in the image.
#
# The password is NOT set here: LAVALINK_SERVER_PASSWORD (from the ESO-owned
# Secret, mapped in pod.yaml) overrides server.password. The port is likewise
# pinned with SERVER_PORT, since the bundled default is 8080 while every
# Lavalink client convention expects 2333.
#
# The built-in YouTube source is DISABLED and replaced by the
# lavalink-devs/youtube-source plugin. The built-in source is deprecated and
# currently broken against YouTube: its signature cipher extraction fails with
# "Must find action functions from script", which surfaces in the bot as
# "Something went wrong while looking up the track. [fault]".
lavalink:
  server:
    # Password/port come from env; these are placeholders Lavalink overrides.
    password: ""
    port: 2333
    # Trace-level logging for the youtube plugin while diagnosing why most
    # videos return "All clients failed to load the item". Drop back to INFO
    # once playback is confirmed working — the DEBUG dumps of the InnerTube
    # response are very large.
    logging:
      level:
        dev.lavalink.youtube: DEBUG
        lavalink: INFO
    sources:
      # Required: the plugin replaces the deprecated built-in source.
      youtube: false
      # Explicitly keep the other remote sources on.
      soundcloud: true
      bandcamp: true
      twitch: true
      vimeo: true
      http: true
      local: false
    # Lavalink needs a real voice server address for playback. Uncomment and
    # set this to the node's reachable IP if playback stalls or fails.
    # address: 192.168.1.0
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      repository: "https://maven.lavalink.dev/releases"

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # Ordered most-reliable-first. TV is first deliberately: it is the one
    # OAuth-capable client and YouTube gates far fewer videos for it. A
    # NARROW list is the failure mode here — with only WEB/WEB_EMBEDDED the
    # plugin has no cipher left to derive a stream URL and reports
    # "No supported audio streams available, available types: " (empty), which
    # the bot surfaces as "All clients failed to load the item".
    clients:
      - TV
      - MWEB
      - WEB
      - MUSIC
      - WEBEMBEDDED
      - ANDROID_VR
      - TVHTML5_SIMPLY
      - ANDROID_MUSIC
      - IOS
    # Signature cipher is no longer derivable from YouTube's JS, so point at a
    # public cipher server instead of relying on the in-process cipher. Without
    # this, WEB/WEB_EMBEDDED cannot produce a playable stream URL.
    remoteCipher:
      url: https://cipher.kikkia.dev/
      userAgent: homek8s-vocard

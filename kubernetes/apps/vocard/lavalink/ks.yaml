---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: lavalink
spec:
  interval: 1m
  path: ./kubernetes/apps/vocard/lavalink/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
      # application.yml carries ${YOUTUBE_OAUTH_REFRESH_TOKEN} from the
      # ESO-owned lavalink Secret, so it must be substituted here too.
      - name: lavalink
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: vocard
  wait: false

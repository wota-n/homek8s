---
# Cluster-internal Service so something can resolve/route to this pod later.
# No ports are served (the pod listens on nothing), so the port list is
# intentionally empty -- this exists to give the pod a stable, addressable
# name. Add an HTTPRoute on envoy-internal + a real port here when the
# namespace starts serving traffic.
apiVersion: v1
kind: Service
metadata:
  name: strata
spec:
  type: Unknown
  selector:
    k8s-app: strata
  ports: []

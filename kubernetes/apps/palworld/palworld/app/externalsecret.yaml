---
# Join password for the dedicated server. This app's ks.yaml lists the target
# Secret under postBuild.substituteFrom, so the ${PALWORLD_SERVER_PASSWORD}
# placeholder in helmrelease.yaml resolves from Bitwarden Secrets Manager and
# nothing secret is committed (same pattern as vocard/lavalink).
#
# REQUIRED Bitwarden key (same BSM project as the other apps):
#   PALWORLD_SERVER_PASSWORD   the password friends type to join the server
#
# Until that key exists the ExternalSecret is red and the Kustomization cannot
# substitute — expected, not a manifest bug. Create the key, then:
#   kubectl annotate externalsecret palworld -n palworld force-sync="$(date +%s)" --overwrite
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: palworld
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-login
    kind: ClusterSecretStore
  target:
    name: palworld
    creationPolicy: Owner
  data:
    - secretKey: PALWORLD_SERVER_PASSWORD
      remoteRef:
        key: PALWORLD_SERVER_PASSWORD

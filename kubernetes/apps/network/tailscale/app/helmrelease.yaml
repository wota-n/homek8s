---
# Tailscale Kubernetes Operator — cluster-wide, lives in `network` alongside
# envoy/cloudflare-tunnel because it is cluster plumbing, not part of any app.
#
# Apps are exposed by annotating THEIR OWN Service; nothing app-side references
# this HelmRelease. See media/jellyfin when that lands.
#
# The OAuth credentials are owned by ESO (see externalsecret.yaml), so the
# `oauth` block below is intentionally EMPTY. If you set oauth.clientId here
# the chart would render its own Secret and Flux would push the literal into a
# public repo. Do not do that.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
spec:
  chartRef:
    kind: HelmChart
    name: tailscale-operator
  interval: 1h
  values:
    installCRDs: true

    # Operator's own ACL tag. Must be listed under `tagOwners` in the tailnet
    # ACL policy, otherwise the operator cannot authenticate.
    operatorConfig:
      defaultTags:
        - "tag:k8s-operator"
      # Was temporarily "debug" while chasing the serve-config question.
      # Debug output settled it: the operator logs
      #   service "svc:media-jellyfin" is already advertised
      # and manages ONLY the VIP advertisement (AdvertiseServices +
      # ingress-config.json IPv4Mapping). It never writes serve-config.json —
      # that is by design for VIP-mode Tailscale Services, not a fault.
      logging: "info"
      image:
        repository: ghcr.io/tailscale/k8s-operator
        # Chart version is 1.102.4; the IMAGE tag is v1.102.4 (leading v).
        # Verified by manifest HEAD: ghcr 1.102.4 -> 404, v1.102.4 -> 200.
        tag: "v1.102.4"
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 512Mi

    # Tag applied to every proxy the operator creates. Also needs a tagOwners
    # entry pointing at tag:k8s-operator.
    proxyConfig:
      image:
        repository: ghcr.io/tailscale/tailscale
        # NEWER than the operator on purpose. k8s-operator has no v1.102.5
        # (404) so it is pinned at v1.102.4, but the proxy client has one, and
        # that client-side fix is what makes the operator's serve config
        # actually load: at v1.102.4 the operator wrote AdvertiseServices but no
        # serve-config, and both proxies logged
        #   "serve proxy: no serve config at /etc/proxies/serve-config.json"
        # while `tailscale serve status` said "No serve config" — with no error
        # logged by the operator. Mixed operator/proxy versions are supported;
        # a client AHEAD of the operator is the working direction here.
        tag: "v1.102.5"
      defaultTags: "tag:k8s"

    # We reach the cluster over the LAN, not through the public api endpoint.
    apiServerProxyConfig:
      mode: "false"
      allowImpersonation: "false"

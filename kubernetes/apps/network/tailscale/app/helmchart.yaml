---
# The chart artifact. Flux needs a HelmChart (not the HelmRepository directly):
# supported spec.chartRef.kind values are OCIRepository, HelmChart,
# ExternalArtifact — a plain Helm repo is the INDEX, the chart is a HelmChart.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmChart
metadata:
  name: tailscale-operator
spec:
  interval: 1h
  chart: tailscale-operator
  version: 1.102.4
  sourceRef:
    kind: HelmRepository
    name: tailscale

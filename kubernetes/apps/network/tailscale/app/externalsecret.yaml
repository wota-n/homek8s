---
# Tailscale OAuth client credentials for the operator.
#
# The operator's Deployment mounts a Secret named `operator-oauth` with keys
# `client_id` and `client_secret` (chart default — see values.yaml
# `oauthSecretVolume: {}` being unset). ESO writes that exact Secret, so the
# credentials never appear in this public repo.
#
# REQUIRED Bitwarden keys (create in the BSM project 'bitwarden-login' points at):
#   TAILSCALE_OAUTH_CLIENT_ID
#   TAILSCALE_OAUTH_CLIENT_SECRET
#
# The OAuth client itself must be created in the Tailscale admin console with
# these scopes, and be tagged `tag:k8s-operator`. That step is manual — see
# the app's README/notes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tailscale-operator-oauth
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-login
    kind: ClusterSecretStore
  target:
    name: operator-oauth
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: TAILSCALE_OAUTH_CLIENT_ID
    - secretKey: client_secret
      remoteRef:
        key: TAILSCALE_OAUTH_CLIENT_SECRET

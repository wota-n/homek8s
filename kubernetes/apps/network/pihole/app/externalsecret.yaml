---
# Create PIHOLE_ADMIN_PASSWORD in the Bitwarden project used by bitwarden-login
# before deploying. The admin password stays out of the public Git repository.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pihole-admin
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-login
    kind: ClusterSecretStore
  target:
    name: pihole-admin
  data:
    - secretKey: password
      remoteRef:
        key: PIHOLE_ADMIN_PASSWORD

---
# Grafana admin credentials. Set explicitly rather than letting the chart
# generate one, for two reasons:
#
# 1. Grafana is an admin UI with full access to every metric in the cluster.
# 2. The grafana subchart uses Helm's `lookup` function to preserve a generated
#    password across upgrades. helm-controller does not support `lookup` (it
#    renders without cluster access), so a generated password would be
#    regenerated on every chart bump and lock you out.
#
# REQUIRED Bitwarden keys (project behind ClusterSecretStore 'bitwarden-login'):
#   GRAFANA_ADMIN_USER
#   GRAFANA_ADMIN_PASSWORD
#
# The secret's keys are admin-user / admin-password because that is what the
# Grafana chart's admin.userKey / admin.passwordKey default to; the HelmRelease
# points grafana.admin.existingSecret at this Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-login
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: GRAFANA_ADMIN_USER
    - secretKey: admin-password
      remoteRef:
        key: GRAFANA_ADMIN_PASSWORD

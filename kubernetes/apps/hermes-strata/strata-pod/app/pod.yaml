---
# Placeholder pod proving the hermes-strata namespace syncs end to end.
# Alpine kept tiny: sh sleep loop, no probes needed beyond default.
apiVersion: v1
kind: Pod
metadata:
  name: strata-pod
  labels:
    k8s-app: strata-pod
spec:
  containers:
    - name: strata
      image: docker.io/library/alpine:3.21.0
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c", "while true; do sleep 30; done"]

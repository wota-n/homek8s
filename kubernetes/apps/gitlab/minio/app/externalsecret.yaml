---
# MinIO root credentials for GitLab's object storage.
#
# The chart's own Secret template is bypassed with `existingSecret` below, so these
# values never enter this public repo. The KEY NAMES are fixed by the chart — the
# rendered statefulset reads `rootUser` and `rootPassword` from this Secret for
# MINIO_ROOT_USER / MINIO_ROOT_PASSWORD (verified by rendering with --set
# existingSecret=... ), so renaming them here silently produces a MinIO that starts
# with no credentials.
#
# REQUIRED Bitwarden keys (project behind ClusterSecretStore 'bitwarden-login'):
#   MINIO_ROOT_USER
#   MINIO_ROOT_PASSWORD
#
# The password lands inside GitLab's own object-store config as well, so keep it
# alphanumeric (plus -._~) and comfortably long: no shell/URL escaping games needed.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-minio
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-login
    kind: ClusterSecretStore
  target:
    name: gitlab-minio
    creationPolicy: Owner
  data:
    - secretKey: rootUser
      remoteRef:
        key: MINIO_ROOT_USER
    - secretKey: rootPassword
      remoteRef:
        key: MINIO_ROOT_PASSWORD
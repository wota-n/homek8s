---
# MinIO — the S3-compatible object store GitLab writes artifacts, uploads, LFS objects
# and packages to.
#
# WHY THIS APP EXISTS AT ALL: GitLab chart 10.x (GitLab 19) removed the bundled MinIO
# AND removed the shared-PVC option. With object storage disabled the webservice
# Deployment mounts `shared-upload-directory` as an **emptyDir** (verified in the
# chart's webservice deployment template, not inferred), so every CI artifact and every
# upload would vanish the moment the pod was replaced. Since CI/CD is the feature this
# deployment exists for, that would have been quietly non-durable — hence a real store.
#
# Credentials are NEVER in this repo: the chart's own Secret template is bypassed with
# `existingSecret` below, and the keys it reads — `rootUser` / `rootPassword` — come
# from the ExternalSecret in this directory (Bitwarden keys MINIO_ROOT_USER /
# MINIO_ROOT_PASSWORD). Those exact key names are fixed by the chart, not chosen here.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitlab-minio
spec:
  interval: 1h
  chartRef:
    kind: HelmChart
    name: minio
  values:
    # Single node — NOT the chart's `distributed` default, which wants 4+ pods and a
    # 4-drive layout this cluster does not have.
    mode: standalone

    # IMAGE SOURCE — READ THIS BEFORE "UPGRADING" IT BACK.
    #
    # MinIO deprecated its public container images. Anonymous pulls of BOTH
    # quay.io/minio/minio and docker.io/minio/minio now answer 401 UNAUTHORIZED
    # (verified from this desktop against a control image that pulls fine from the
    # same registry — nginx on Docker Hub, cilium on quay — so this is upstream
    # gating, not this cluster's network or a rate limit). The pod symptom is
    # `ImagePullBackOff ... 401 UNAUTHORIZED`, which looks like a cluster fault and
    # is not. Every mc image is gated the same way, which is why mcImage below is
    # pinned to the same mirror: the makeBucketJob cannot use quay.io/minio/mc.
    #
    # bitnamilegacy/minio is the same upstream build repackaged by Bitnami —
    # `minio --version` inside it reports DEVELOPMENT.2024-12-18T13-15-44Z, byte for
    # byte the release this chart asked for. Two consequences, both handled below:
    #   1. It ships no /usr/bin/docker-entrypoint.sh, which is what the chart's
    #      statefulset hardcodes as its command → overridden in postRenderers below.
    #   2. It runs as uid 1001, not 1000 → securityContext below.
    image:
      repository: bitnamilegacy/minio
      tag: 2024.12.18
      pullPolicy: IfNotPresent

    # The mc client the makeBucketJob runs. The bitnami image carries mc at
    # /opt/bitnami/minio-client/bin/mc and puts it on PATH, which is all the chart's
    # /config/initialize script needs — verified by running the image and executing
    # `mc --version` (DEVELOPMENT.2024-11-21T17-21-54Z, matching the mc release the
    # chart pins). The job's own command is already `/bin/sh /config/initialize`,
    # so it bypasses the image entrypoint entirely.
    mcImage:
      repository: bitnamilegacy/minio
      tag: 2024.12.18
      pullPolicy: IfNotPresent

    existingSecret: gitlab-minio

    # GitLab will not create buckets; it expects them to exist. The chart's
    # makeBucketJob creates these right after the server comes up. The four names must
    # match global.appConfig.*.bucket in the GitLab HelmRelease; the fifth is the
    # runner's distributed build cache (see gitlab-runner.runners.cache there).
    buckets:
      - name: gitlab-artifacts
      - name: git-lfs
      - name: gitlab-uploads
      - name: gitlab-packages
      - name: gitlab-runner-cache

    # ClusterIP only. GitLab reaches it in-cluster at
    # gitlab-minio.gitlab.svc.cluster.local:9000 — no ingress, no LoadBalancer, and
    # therefore no LAN or internet exposure for the object store itself.
    service:
      type: ClusterIP
      port: "9000"
    ingress:
      enabled: false
    consoleIngress:
      enabled: false

    persistence:
      enabled: true
      storageClass: local-path
      accessMode: ReadWriteOnce
      size: 20Gi

    # The chart defaults to uid/gid 1000 because MinIO's own image runs as 1000.
    # bitnamilegacy/minio runs as 1001, and it opens the data directory before
    # dropping to any subuid — at 1000 it dies immediately with
    #   FATAL Unable to initialize backend: Unable to write to the backend
    # Verified live: identical command at 1001 comes up clean.
    securityContext:
      enabled: true
      runAsUser: 1001
      runAsGroup: 1001
      fsGroup: 1001

    # The chart's default is requests.memory: 16Gi, which is most of this node. Set a
    # sane request; the limit is the real guard.
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi

  # The chart's Deployment hardcodes its container command as
  #   /usr/bin/docker-entrypoint.sh minio server <pool> -S /etc/minio/certs/ ...
  # That script only exists in MinIO's own (now gated) image. bitnamilegacy/minio
  # has no entrypoint shim and its own /opt/bitnami/scripts/minio/entrypoint.sh
  # expects `minio server` to already be argv[1] — feeding it the chart's command
  # verbatim fails with `exec: server: not found`. So replace the command with the
  # equivalent direct invocation. The server URL is left OFF, which is what makes
  # this standalone: without an explicit URL minio serves plain /export, and adding
  # one would flip the chart into distributed mode (16 replicas) — the poolCount
  # helper only emits a URL for mode != standalone.
  #
  # Target is a Deployment, NOT a StatefulSet — minio chart 5.4.0 renders a
  # Deployment even in standalone mode (verified in `helm template` output), and a
  # mismatched target makes the postRenderer a silent no-op: the release still
  # installs and the pod crashloops on the original command.
  # Verified live before being written here: this exact command against an emptyDir
  # comes up as "MinIO Object Storage Server / API: http://...:9000".
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: gitlab-minio
            patch: |-
              - op: replace
                path: /spec/template/spec/containers/0/command
                value:
                  - /bin/sh
                  - -ce
                  - minio server /export -S /etc/minio/certs/ --address :9000 --console-address :9001
          # The makeBucketJob is the second half of the same image problem. The chart's
          # /config/initialize script hardcodes `MC="/usr/bin/mc --insecure"`, and
          # /usr/bin/mc is a path that only ever existed in MinIO's own (gated) image.
          # In bitnamilegacy/minio the binary lives at
          # /opt/bitnami/minio-client/bin/mc — on PATH, so anything invoking plain `mc`
          # works, but this script uses the ABSOLUTE path and dies with
          #   /config/initialize: 27: /usr/bin/mc: not found
          # retrying 29 times before the job gives up, which is what a wedged
          # `2/2 Running` post-job with no buckets in it looks like.
          #
          # The fix is a one-line symlink created before the script runs. It has to be
          # root: the symlink lands in /usr/bin, which is not writable by the image's
          # uid 1001 (verified — `ln: Permission denied` at 1001, succeeds at 0).
          # initContainer is NOT an option: containers in a pod have separate
          # filesystems, so a symlink made there is gone by the time the script runs.
          # Both make-bucket and make-user get the treatment, since add-user calls the
          # same absolute path.
          - target:
              kind: Job
              name: gitlab-minio-post-job
            patch: |-
              - op: replace
                path: /spec/template/spec/containers/0/command
                value:
                  - /bin/sh
                  - -c
                  - ln -sf /opt/bitnami/minio-client/bin/mc /usr/bin/mc && exec /bin/sh /config/initialize
              - op: replace
                path: /spec/template/spec/containers/0/securityContext
                value:
                  runAsUser: 0
                  runAsGroup: 0
              - op: replace
                path: /spec/template/spec/containers/1/command
                value:
                  - /bin/sh
                  - -c
                  - ln -sf /opt/bitnami/minio-client/bin/mc /usr/bin/mc && exec /bin/sh /config/add-user
              - op: replace
                path: /spec/template/spec/containers/1/securityContext
                value:
                  runAsUser: 0
                  runAsGroup: 0

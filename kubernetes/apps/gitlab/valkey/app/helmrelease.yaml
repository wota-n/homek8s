---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitlab-valkey
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: valkey
  # NOTE: there is deliberately NO dependsOn here. HelmRelease.dependsOn can only
  # reference another HelmRelease, and the Secret this chart consumes
  # (gitlab-valkey-auth) is produced by an ExternalSecret, which is not one — naming it
  # here blocks the install forever waiting for a HelmRelease that will never exist.
  # Instead the chart's init container simply waits: until ESO syncs the Secret the pod
  # sits in CreateContainerConfigError, which self-resolves seconds later and needs no
  # manifest change. ESO and this HelmRelease are applied by the same Kustomization.
  values:
    image:
      repository: valkey/valkey
      tag: "9.0"

    architecture: standalone

    auth:
      enabled: true
      # Never an inline password — that is the chart's own Secret path and it would put
      # the credential in this public repo. This Secret is written by ESO from
      # Bitwarden key GITLAB_VALKEY_PASSWORD.
      usersExistingSecret: gitlab-valkey-auth
      aclUsers:
        default:
          # The 'default' user must exist, and must be listed whenever auth is on, or
          # Valkey refuses every unauthenticated client.
          permissions: "~* &* +@all"
          passwordKey: default

    # Cache/queue data. Redis holds Sidekiq queues and cache, not git data, so this
    # stays small — and the NVMe request is a label, not a quota.
    dataStorage:
      enabled: true
      className: local-path
      requestedSize: 5Gi
      accessModes:
        - ReadWriteOnce

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
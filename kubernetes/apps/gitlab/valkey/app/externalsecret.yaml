---
# Valkey ACL password. The chart's OWN secret template only renders when a password is
# supplied inline in values (auth.aclUsers.*.password), which would write the
# credential into this public repo. Instead the chart is pointed at this ESO-managed
# Secret via `auth.usersExistingSecret`, so the value lives in Bitwarden only.
#
# The chart reads the password from key `default` for the `default` user — that key
# name is fixed by the chart (`$passwordKey | default "default"` in its statefulset and
# deploy templates), not chosen here.
#
# REQUIRED Bitwarden key (project behind ClusterSecretStore 'bitwarden-login'):
#   GITLAB_VALKEY_PASSWORD
#
# Keep it alphanumeric (plus -._~): it is an ACL password read by Valkey itself, but
# it also travels into GitLab's own redis.yml, and avoiding shell/URL metacharacters
# removes a whole class of quoting failures.
#
# GitLab's HelmRelease points global.redis.auth at this same Secret and key, so the
# consumer and the provider cannot drift apart.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-valkey-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-login
    kind: ClusterSecretStore
  target:
    name: gitlab-valkey-auth
    creationPolicy: Owner
  data:
    - secretKey: default
      remoteRef:
        key: GITLAB_VALKEY_PASSWORD
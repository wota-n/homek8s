---
# GitLab web UI and git-over-HTTPS — LAN ONLY, deliberately.
#
# Attached to envoy-internal (192.168.1.162) and to nothing else. external-dns only
# watches envoy-external, so this creates NO public Cloudflare record: the name
# resolves on the LAN through k8s-gateway (CoreDNS) and from nowhere else. That is the
# requirement for this app — it holds private repositories and must not be reachable
# from the internet.
#
# Consequence to be aware of: cloning over HTTPS works on the LAN only. Git over SSH
# is NOT exposed either (the chart's gitlab-shell Service stays ClusterIP), so there is
# no SSH clone path from outside the LAN by design.
#
# TLS is the cluster wildcard cert (*.${SECRET_DOMAIN}) already attached to the
# gateway listener — never mint a per-app cert.
#
# GitLab composes its external URL as https://gitlab.${SECRET_DOMAIN} from
# global.hosts.domain in the HelmRelease beside this file; the two must agree or every
# redirect, clone URL and CI badge points at a name nothing serves.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gitlab
spec:
  hostnames: ["gitlab.${SECRET_DOMAIN}"]
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        # The webservice Service the chart creates for the `default` pod group.
        # Workhorse listens on 8181; it is what serves both the web UI and git HTTP.
        - name: gitlab-webservice-default
          port: 8181

---
# S3 connection GitLab's object storage uses, assembled from the MinIO root
# credentials that already live in Bitwarden. The value never enters this repo.
#
# GitLab reads the Secret's `connection` key as YAML (wired in the HelmRelease as
# global.appConfig.object_store.connection). `path_style: true` is required by MinIO;
# `host` and `endpoint` both point at the in-cluster Service.
#
# NOTE: this template interpolates the credentials into YAML, so keep
# MINIO_ROOT_PASSWORD alphanumeric (plus -._~) — a `:` or `#` would produce invalid
# YAML and GitLab would fail to parse its object storage config. Same constraint the
# MinIO ExternalSecret in ../minio already documents.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-object-storage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-login
    kind: ClusterSecretStore
  target:
    name: gitlab-object-storage
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        connection: |
          provider: AWS
          region: us-east-1
          aws_access_key_id: {{ .rootUser }}
          aws_secret_access_key: {{ .rootPassword }}
          host: gitlab-minio.gitlab.svc.cluster.local:9000
          endpoint: http://gitlab-minio.gitlab.svc.cluster.local:9000
          path_style: true
  data:
    - secretKey: rootUser
      remoteRef:
        key: MINIO_ROOT_USER
    - secretKey: rootPassword
      remoteRef:
        key: MINIO_ROOT_PASSWORD
---
# Distributed build cache for the GitLab Runner, backed by the same MinIO.
#
# The runner chart mounts this Secret at /secrets and its entrypoint exports
# CACHE_S3_ACCESS_KEY / CACHE_S3_SECRET_KEY from the keys `accesskey` and `secretkey` —
# those two names are fixed by the chart (see gitlab-runner templates/configmap.yaml).
# The bucket is created by the MinIO HelmRelease in ../minio.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-runner-cache
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-login
    kind: ClusterSecretStore
  target:
    name: gitlab-runner-cache
    creationPolicy: Owner
  data:
    - secretKey: accesskey
      remoteRef:
        key: MINIO_ROOT_USER
    - secretKey: secretkey
      remoteRef:
        key: MINIO_ROOT_PASSWORD

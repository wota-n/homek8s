---
# GitLab CE (chart 10.4.1 → GitLab 19.4.1).
#
# THIS CHART IS NO LONGER A ONE-MAN SHOW. GitLab chart 10.0 (GitLab 19.0) removed the
# bundled PostgreSQL, Redis and MinIO subcharts, and its own config guards now ABORT
# the render if they are not supplied externally:
#   _checkConfig_postgresql.tpl -> "You must configure an PostgreSQL connetion.
#                                   Please set `global.psql.host`. Since chart v10.0.0,
#                                   external PostgreSQL became required."
#   _checkConfig_redis.tpl       -> same for `global.redis.host`.
# So GitLab here is deliberately a multi-app family under one category/namespace:
# ../postgres (CloudNativePG 17) and ../valkey are dependencies of this app, and
# `kubernetes/apps/gitlab/` is the single Flux Kustomization set that retires them all.
#
# The real dependency on ZOT: GitLab's built-in Container Registry is DISABLED below
# (`registry.enabled: false`). The zot registry in kubernetes/apps/registry/zot is the
# image registry on this cluster, and leaving the bundled one on would run a second,
# redundant registry and trip `gitlab.checkConfig.objectStorage.registry.configured`
# (it demands an object-storage Secret the chart no longer provides). GitLab pushes and
# pulls container images through ZOT instead; the note on `global.registry` below has
# the wiring, and the vault note "GitLab on homek8s" has the end-to-end CI recipe.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitlab
spec:
  interval: 1h
  chartRef:
    kind: HelmChart
    name: gitlab
  # Migrate only after the dependencies are Ready, or the migrations job runs before
  # PostgreSQL/Valkey/MinIO exist and wedges on a connection error (which then has to be
  # cleared by deleting the failed Helm release, not by re-running).
  dependsOn:
    - name: cloudnative-pg
      namespace: gitlab
    - name: gitlab-valkey
      namespace: gitlab
    - name: gitlab-minio
      namespace: gitlab
  # helm-controller's default install/upgrade timeout is 5m and this chart cannot meet
  # it on one node: shared-secrets, then the configmap and migrations jobs, then
  # webservice/sidekiq/gitaly/shell must ALL report ready inside the window. Exceeding
  # it does not merely retry — the install is recorded as a FAILED version, the follow-up
  # upgrade fails the same way, and remediation then cannot roll back a release whose
  # every version failed (`missing target release for rollback`). That wedges the release
  # permanently and it has to be cleared by hand (delete the failed `owner=helm` secrets,
  # reinstall from this file, let Flux adopt it) — which is exactly what happened to
  # gitlab-valkey on 2026-10-11, where the ESO Secret for the ACL password arrived late
  # and the pod sat in CreateContainerConfigError past the 5m mark.
  # Having all three dependencies Ready is NOT enough to make 5m sufficient.
  install:
    timeout: 30m
  upgrade:
    timeout: 30m
  values:
    global:
      # CE, not the chart's default `ee`: this is a personal instance and EE without a
      # license only adds license nag screens. CI/CD pipelines — the feature asked
      # for — are included in CE, so nothing is lost.
      edition: ce

      hosts:
        # GitLab composes its external URL as https://gitlab.<domain>; this must match
        # the httproute.yaml hostname beside this file or every redirect and clone URL
        # points at a name that does not resolve on the LAN.
        domain: ${SECRET_DOMAIN}
        https: true

      # The cluster ALREADY has an Envoy Gateway pair (envoy-internal / envoy-external)
      # and a wildcard cert. The chart's Gateway API support defaults to
      # enabled+installEnvoy, which would install a SECOND Envoy Gateway and fight the
      # existing one. Route this app through the existing gateway with the HTTPRoute
      # beside this file instead.
      gatewayApi:
        enabled: false
        installEnvoy: false
        # Defaults to TRUE, and it gates the certmanager-issuer subchart, which renders
        # a Let's Encrypt issuer + job. Left on, the chart fails its own render with
        # "You must provide an email to associate with your TLS certificates" and, once
        # given one, would try to issue a cert against the public ACME endpoint for a
        # LAN-only name. The wildcard cert from the existing Envoy gateway covers
        # gitlab.<domain>, so this issuer has no job here.
        configureCertmanager: false

      ingress:
        enabled: false

      # External PostgreSQL 17 (CloudNativePG in ../postgres). The Secret is created by
      # CNPG itself during bootstrap — key `password` in `gitlab-postgres-app` — so the
      # credential never passes through this public repo.
      psql:
        host: gitlab-postgres-rw.gitlab.svc.cluster.local
        port: 5432
        database: gitlabhq_production
        username: gitlab
        password:
          secret: gitlab-postgres-app
          key: password

      # External Redis-compatible store (Valkey in ../valkey). Note `auth`, not
      # `password` — `global.redis.password` was renamed in the 10.x line and the old
      # key is silently ignored, leaving GitLab unable to authenticate.
      redis:
        host: gitlab-valkey.gitlab.svc.cluster.local
        port: 6379
        auth:
          enabled: true
          secret: gitlab-valkey-auth
          key: default

      # Container Registry: OFF. ZOT is the registry on this cluster. This value also
      # tells Rails not to advertise a `registry.gitlab`-style endpoint that nothing is
      # serving, so CI jobs are pointed at ZOT explicitly instead.
      registry:
        enabled: false

      # Kubernetes Agent — not needed for personal projects and it adds a workload.
      kas:
        enabled: false

      # Initial root password, taken from the ExternalSecret beside this file
      # (Secret `gitlab-secrets`, key GITLAB_ROOT_PASSWORD, from Bitwarden).
      #
      # ORDERING MATTERS and is why this is called out: the chart's own shared-secrets
      # job writes a RANDOM value into this same key if it is absent when the release
      # installs, and the migrations job then seeds the root account from it — leaving a
      # root password nobody knows. ESO creates the Secret within seconds of the
      # Kustomization applying, while this HelmRelease cannot install until its three
      # dependsOn releases are Ready (minutes), so ESO wins the race by construction.
      # Verify after install: the shared-secrets job must log
      # `secret "gitlab-secrets" already exists.` — if it does not, root got a random
      # password and the Bitwarden value is wrong.
      initialRootPassword:
        secret: gitlab-secrets
        key: GITLAB_ROOT_PASSWORD

      # Internal component-to-component TLS. GitLab's webservice/sidekiq/gitaly talk
      # over HTTPS with the CA the chart generates in `shared-secrets`; turning this
      # off does not simplify anything, it just breaks those calls.
      shared-secrets:
        enabled: true

      # Object storage: consolidated, backed by the MinIO in ../minio.
      #
      # Chart 10.0 removed the bundled MinIO AND the shared-PVC option, so leaving
      # these disabled does NOT fall back to local disk: the webservice mounts
      # `shared-upload-directory` as an **emptyDir** (verified in the chart's webservice
      # deployment template) and every artifact, upload, LFS object and package is lost
      # the moment the pod is replaced. CI/CD is what this deployment is for, and CI
      # artifacts are the point of it — so object storage is required, not optional.
      #
      # Consolidated mode (`object_store.enabled: true` with ONE `connection`) is the
      # shape the chart wants: it renders `object_store:` plus one `objects:` entry per
      # type, and in this mode every enabled type must carry a `bucket` and NO per-type
      # `connection`. Mixing the two shapes is a hard render failure
      # (`gitlab.checkConfig.objectStorage.consolidatedConfig`).
      appConfig:
        object_store:
          enabled: true
          connection:
            secret: gitlab-object-storage
            key: connection
        # Bucket names must match the `buckets:` list in ../minio.
        artifacts:
          enabled: true
          bucket: gitlab-artifacts
        lfs:
          enabled: true
          bucket: git-lfs
        uploads:
          enabled: true
          bucket: gitlab-uploads
        packages:
          enabled: true
          bucket: gitlab-packages

    # Do NOT let the chart install a second cert-manager or a bundled Prometheus into a
    # cluster that already runs cert-manager for its wildcard cert and has no
    # Prometheus. Both default to on.
    installCertmanager: false
    prometheus:
      install: false
    upgradeCheck:
      enabled: false

    # GitLab's built-in Container Registry — the subchart, not the global block. This
    # is the toggle `gitlab.checkConfig.objectStorage.registry.configured` reads; it is
    # what stops the duplicate registry and the object-storage guard together.
    registry:
      enabled: false

    # CI/CD — the feature this deployment exists for. The runner chart ships as a
    # subchart of this one, and enabling it here is genuinely all that is needed,
    # because the PARENT chart generates the runner token and wires it in:
    #   * shared-secrets creates Secret `<release>-gitlab-runner-secret`
    #     (keys runner-registration-token / runner-token);
    #   * the migrations job seeds that token into the instance
    #     (`gitlab_shared_runners_registration_token`);
    #   * the parent overrides the subchart's `gitlab-runner.secret` template to point
    #     at that same Secret, so the runner registers itself on first boot.
    # There is therefore no "create a runner in the UI and paste a token" step, and no
    # token in this repo. (Registration tokens are gone in modern GitLab, which is why
    # the chart drives its own bundled runner this way.)
    gitlab-runner:
      install: true
      rbac:
        create: true
      runners:
        # Untagged, so a project's default .gitlab-ci.yml runs with no tag wiring —
        # the closest thing to "a pipeline just runs", as in ADO.
        runUntagged: true
        locked: false
        # Distributed cache in the same MinIO. The Secret supplies the chart-fixed key
        # names accesskey/secretkey, which the entrypoint exports as CACHE_S3_*.
        cache:
          secretName: gitlab-runner-cache
        config: |
          [[runners]]
            [runners.kubernetes]
              # Each job runs as its own pod. Talos has no docker socket, so the
              # kubernetes executor (not docker) is the only viable one here.
              # Job pods land in this namespace so the runner ServiceAccount and Role
              # created by rbac.create above apply to them.
              namespace = "gitlab"
              # Default image only; a job's own `image:` always wins. ubuntu keeps
              # ordinary shell scripts behaving like a normal build agent.
              image = "ubuntu:22.04"
            [runners.cache]
              Type = "s3"
              Path = "gitlab-runner"
              Shared = true
              [runners.cache.s3]
                ServerAddress = "gitlab-minio.gitlab.svc.cluster.local:9000"
                BucketName = "gitlab-runner-cache"
                Insecure = true

    gitlab:
      # Repositories live in Gitaly. This is the claim that holds the actual git data —
      # the one PVC here whose loss is unrecoverable without a backup, so it gets the
      # bulk of the space. Size is a label, not a quota (local-path enforces none).
      gitaly:
        persistence:
          enabled: true
          size: 50Gi
          storageClass: local-path
          accessMode: ReadWriteOnce
        # Holds the actual git data; give it real memory.
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            memory: 1Gi

      webservice:
        # One replica: this is a single node, and the chart's default of 2 doubles the
        # largest memory request in the whole stack for no availability benefit (both
        # copies would live on the same machine).
        minReplicas: 1
        maxReplicas: 2
        resources:
          requests:
            cpu: 300m
            memory: 1Gi
          limits:
            memory: 2Gi
        # Puma workers. The default is higher than this node wants (4 CPU total, shared
        # with everything else), and over-provisioning here shows up as the whole
        # instance being slow rather than as an error.
        puma:
          workerProcesses: 2
          minThreads: 4
          maxThreads: 8

      sidekiq:
        # Single node: no concurrency to exploit with more workers, and each concurrent
        # job is another process competing for the same 4 CPUs.
        concurrency: 10
        # Pin the replica count to 1 — the chart's own HPA defaults to max 10 and will
        # scale up on a CPU spike (sidekiq boot itself trips it). This node's CPU
        # REQUESTS already sit at ~96% of allocatable, so a scaled-up replica cannot be
        # scheduled at all, and an unschedulable pod under a Deployment keeps that
        # Deployment unavailable — which is what the HelmRelease's readiness wait is
        # waiting on, so a transient spike turns into an install/upgrade timeout and,
        # from there, a wedged release. Observed live on the first install: HPA 1 -> 3,
        # third pod `0/1 Pending  Insufficient cpu`, install action stalled on it.
        minReplicas: 1
        maxReplicas: 1
        resources:
          requests:
            cpu: 200m
            memory: 1Gi
          limits:
            memory: 2Gi

      gitlab-shell:
        # Also defaults to 2 replicas; one is enough on one node.
        minReplicas: 1
        maxReplicas: 1

      # No GitLab CI Kubernetes Agent / in-cluster execution environment here — this is
      # a personal instance, and agent-based CI would need the KAS service this
      # manifest deliberately leaves off.
      toolbox:
        enabled: true
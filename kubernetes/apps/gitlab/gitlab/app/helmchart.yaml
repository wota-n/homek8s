---
# Chart 10.4.1 → GitLab 19.4.1. Bump both together; the chart's own version is the
# only correct pin because the umbrella chart's guards changed in the 10.0 line.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/helmchart_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmChart
metadata:
  name: gitlab
spec:
  interval: 1h
  chart: gitlab
  version: 10.4.1
  sourceRef:
    kind: HelmRepository
    name: gitlab
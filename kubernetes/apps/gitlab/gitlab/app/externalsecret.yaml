---
# GitLab root/admin login.
#
# The chart can generate a random root password into a Secret, but then the only way
# to read it is `kubectl`, and it changes on every reinstall. Putting the initial
# password in Bitwarden keeps one copy, off this public repo.
#
# Set this key BEFORE the first successful migration, otherwise GitLab seeds the root
# account with its own generated secret and changing it later requires an
# `rails runner` reset rather than an edit here.
#
# REQUIRED Bitwarden keys (project behind ClusterSecretStore 'bitwarden-login'):
#   GITLAB_ROOT_EMAIL
#   GITLAB_ROOT_PASSWORD
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-login
    kind: ClusterSecretStore
  target:
    name: gitlab-secrets
    creationPolicy: Owner
  data:
    - secretKey: GITLAB_ROOT_EMAIL
      remoteRef:
        key: GITLAB_ROOT_EMAIL
    - secretKey: GITLAB_ROOT_PASSWORD
      remoteRef:
        key: GITLAB_ROOT_PASSWORD
---
# CloudNativePG operator ONLY — installed separately from the Cluster it backs.
#
# WHY TWO KUSTOMIZATIONS: the operator ships the `postgresql.cnpg.io` CRDs and the
# `Cluster` object below is an instance of one of them. Flux cannot order resources
# WITHIN a Kustomization, so a Kustomization holding both a CRD and a CR of it fails
# its server-side-apply dry-run with
#   no matches for kind "Cluster" in version "postgresql.cnpg.io/v1"
# and then applies NOTHING — not even the operator HelmRelease that would have created
# the CRD. That is a deadlock, not a retry: it was measured on this cluster.
#
# `wait: true` is what makes the split work: it holds this Kustomization Ready until
# the HelmRelease reports installed, i.e. until the CRDs are established and not merely
# created. The sibling `gitlab-postgres` Kustomization dependsOn this one.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gitlab-postgres-operator
spec:
  interval: 1h
  path: ./kubernetes/apps/gitlab/postgres/operator/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: gitlab
  wait: true
  timeout: 5m

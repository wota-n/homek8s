---
# CloudNativePG operator install. Pinned with its chart (0.29.1 / operator 1.30.1).
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: cloudnative-pg
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # Single-node cluster: no replicas to schedule, so the operator's own HA settings
    # stay off. WAL/telemetry defaults are fine as shipped.
    replicaCount: 1
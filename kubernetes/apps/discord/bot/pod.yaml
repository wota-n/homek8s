apiVersion: v1
kind: Pod
metadata:
  name: test-pod
  namespace: discord
spec:
  containers:
    - name: test
      image: busybox
      command: ["sleep", "3600"]
      volumeMounts:
        - mountPath: /test
          name: u-local-hostpath
  volumes:
    - name: u-local-hostpath
      hostPath:
        path: /var/mnt/local-hostpath
# Admin credentials for the Forgejo instance. The chart's
# gitea.admin.existingSecret reads keys 'username' and 'password' from a Secret, so
# the target name must be forgejo-admin and the key names must be exactly those.
#
# The values live in Bitwarden only — this repo is PUBLIC.
#
# REQUIRED Bitwarden keys (project behind ClusterSecretStore 'bitwarden-login'):
#   FORGEJO__ADMIN__USERNAME
#   FORGEJO__ADMIN__PASSWORD
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-admin
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-login
    kind: ClusterSecretStore
  target:
    name: forgejo-admin
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: FORGEJO__ADMIN__USERNAME
    - secretKey: password
      remoteRef:
        key: FORGEJO__ADMIN__PASSWORD
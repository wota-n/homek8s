# LAN-only access through the internal Envoy gateway on the wildcard Let's Encrypt
# cert (*.${SECRET_DOMAIN}). external-dns only watches envoy-external, so this
# attaches NO public Cloudflare record — the name resolves only via k8s-gateway
# (CoreDNS) on the LAN. Replaces the GitLab route of the same shape.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: forgejo
spec:
  hostnames: ["forgejo.${SECRET_DOMAIN}"]
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: forgejo-http
          port: 3000
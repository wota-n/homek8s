---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
spec:
  install:
    crds: CreateReplace  # <--- ADD THIS
  upgrade:
    crds: CreateReplace  # <--- ADD THIS
  chartRef:
    kind: OCIRepository
    name: external-secrets
  interval: 1h
  values:
    installCRDs: true
    bitwarden-sdk-server:
      enabled: true
      extraVolumes:
        - name: tls
          secret:
            secretName: bitwarden-sdk-server-tls
      extraVolumeMounts:
        - name: tls
          mountPath: /tls
          readOnly: true
      # The SDK server reads its serving cert at STARTUP only. cert-manager rotates
      # this CA (and the leaf) on its own schedule; without a restart the pod keeps
      # serving the OLD leaf while ESO verifies against the NEW ca.crt, and EVERY
      # ExternalSecret in the cluster fails with:
      #   tls: failed to verify certificate: x509: certificate signed by unknown authority
      # That happened on 2026-10-09 and took all 12 ExternalSecrets down silently.
      # Reloader rolls the pod the moment the mounted Secret changes.
      podAnnotations:
        reloader.stakater.com/auto: "true"
    leaderElect: true
    serviceMonitor:
      enabled: true
    grafanaDashboard:
      enabled: false
    webhook:
      replicaCount: 2
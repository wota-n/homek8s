---
# Cluster-scoped twin of the namespaced SecretStore "bitwarden-login" so
# ExternalSecrets in *other* namespaces (e.g. hermes) can reference it.
# A namespaced SecretStore is only visible within its own namespace.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: bitwarden-login
spec:
  provider:
    bitwardensecretsmanager:
      caProvider:
          type: Secret
          name: bitwarden-tls-certs
          key: ca.crt
          namespace: external-secrets
      auth:
        secretRef:
          credentials:
            name: bitwarden-secrets
            key: BITWARDEN_ACCESS_TOKEN
      organizationID: "${BITWARDEN_ORG_ID}"
      projectID: "${BITWARDEN_PROJECT_ID}"
      bitwardenServerSDKURL: https://bitwarden-sdk-server.external-secrets.svc.cluster.local:9998

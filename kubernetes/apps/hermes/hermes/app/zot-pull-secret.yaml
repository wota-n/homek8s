---
# imagePullSecret for the private zot registry. zot runs HTTP basic auth
# (htpasswd, see kubernetes/apps/registry/zot/app/helmrelease.yaml), so an
# anonymous pull returns 401 and any pod referencing registry.<domain>/... fails
# with ImagePullBackOff without this.
#
# The vault value is the dockerconfigjson OBJECT ITSELF, as plain JSON text —
# it is NOT base64 of that object. Only the inner `auth` field is base64:
#
#   {"auths":{"registry.${SECRET_DOMAIN}":{"auth":"<base64 of 'user:password'>"}}}
#   ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^
#   that whole line, verbatim, is the key's value
#
# Do NOT wrap the object in base64. Verified 2026-10-14 against live secrets:
# ESO stores the provider's value as raw bytes and the api-server applies the
# single base64 layer itself (zot-auth's `.htpasswd` and hermes'
# `OPENCODE_ZEN_API_KEY` both decode straight to plaintext). A doubly-encoded
# value leaves `.dockerconfigjson` as base64 TEXT, the kubelet's JSON parse
# fails, and the pod ImagePullBackOffs with an error that looks like a
# registry fault rather than a bad secret.
#
# It cannot be random text either — the kubelet parses this JSON and reads
# `auths.<registry>.auth` to build the pull's Authorization header, and zot
# has htpasswd auth on, so a wrong credential 401s.
#
# To generate (never hand the password over in chat):
#   printf '%s' '<user>:<password>' | base64 -w0        # -> the auth field
#   # wrap that in {"auths":{"registry.<domain>":{"auth":"..."}}}  -> paste it
# See 6 - Main Notes/zen-shim/make_zot_creds.sh in the Obsidian vault, which
# writes the single-line value to a 0600 file to keep it out of the transcript.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zot-pull
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-login
    kind: ClusterSecretStore
  target:
    name: zot-pull
    creationPolicy: Owner
    template:
      # dockerconfigjson is the type the kubelet requires for an imagePullSecret.
      # The vault key therefore holds the raw JSON object (see header); ESO
      # writes `.dockerconfigjson` as this template's `data` value verbatim.
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ .ZOT_PULL_SECRET }}"
  data:
    - secretKey: ZOT_PULL_SECRET
      remoteRef:
        key: ZOT_PULL_SECRET

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes
spec:
  # Hermes state (config, .env, sessions, memories, state.db, skills, logs).
  # WAL-mode SQLite on a local ext4-backed volume is safe (no virtiofs/9p).
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi

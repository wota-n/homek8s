---
# Pulls the Hermes secret from Bitwarden Secrets Manager into the `hermes`
# k8s Secret (name must match the pod's envFrom). Uses the ClusterSecretStore
# 'bitwarden-login' (cluster-wide; the namespaced one is only visible in
# the external-secrets namespace).
#
# REQUIRED Bitwarden keys (create in the same BSM project the store points at):
#   OPENROUTER_API_KEY      LLM provider key (or swap for any supported provider key)
#   HERMES_DASHBOARD_BASIC_AUTH_USERNAME
#   HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
#   HERMES_DASHBOARD_BASIC_AUTH_SECRET   (restart-stable sessions)
#
# OPTIONAL (uncomment + create in BSM to enable):
#   TELEGRAM_BOT_TOKEN / TELEGRAM_ALLOWED_USERS / TELEGRAM_HOME_CHANNEL
#   API_SERVER_ENABLED=true / API_SERVER_HOST / API_SERVER_KEY
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-login
    kind: ClusterSecretStore
  target:
    name: hermes
  data:
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: OPENROUTER_API_KEY
    - secretKey: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
      remoteRef:
        key: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
    - secretKey: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
      remoteRef:
        key: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
    - secretKey: HERMES_DASHBOARD_BASIC_AUTH_SECRET
      remoteRef:
        key: HERMES_DASHBOARD_BASIC_AUTH_SECRET
    # LLM provider key for the k8s instance's config (model.provider: opencode-zen).
    # The config itself is deliberately NOT in git (public repo) — it lives on the
    # PVC at /opt/data/config.yaml, pushed with scripts/hermes-push-config.sh.
    - secretKey: OPENCODE_ZEN_API_KEY
      remoteRef:
        key: OPENCODE_ZEN_API_KEY
    # - secretKey: TELEGRAM_BOT_TOKEN
    #   remoteRef:
    #     key: TELEGRAM_BOT_TOKEN
    # - secretKey: API_SERVER_ENABLED
    #   remoteRef:
    #     key: API_SERVER_ENABLED
    # - secretKey: API_SERVER_HOST
    #   remoteRef:
    #     key: API_SERVER_HOST
    # - secretKey: API_SERVER_KEY
    #   remoteRef:
    #     key: API_SERVER_KEY

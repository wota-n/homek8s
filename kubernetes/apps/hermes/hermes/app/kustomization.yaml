---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./httproute.yaml
  - ./pvc.yaml
  - ./pod.yaml
  - ./service.yaml
# shim.py (the OpenCode Zen free-tier compatibility shim run as a sidecar in the
# hermes pod) is kept in git and turned into a ConfigMap here. The name gets a
# content-hash suffix, so editing shim.py changes the Pod's volume reference —
# that is the signal to delete the Pod so it is recreated with the new script.
configMapGenerator:
  - name: hermes-zen-shim
    files:
      - shim.py

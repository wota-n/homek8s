---
# LAN-only access to the Hermes dashboard/API via the internal Envoy gateway.
# k8s-gateway (CoreDNS, 192.168.1.161) serves this hostname on the LAN straight
# from the HTTPRoute; external-dns only watches envoy-external, so attaching to
# envoy-internal creates NO public Cloudflare record.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hermes
spec:
  hostnames: ["hermes.${SECRET_DOMAIN}"]
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: hermes
          port: 9119

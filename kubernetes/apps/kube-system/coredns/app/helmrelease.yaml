---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coredns
spec:
  chartRef:
    kind: OCIRepository
    name: coredns
  interval: 1h
  values:
    fullnameOverride: coredns
    image:
      repository: mirror.gcr.io/coredns/coredns
    k8sAppLabelOverride: kube-dns
    serviceAccount:
      create: true
    service:
      name: kube-dns
      clusterIP: "10.43.0.10"
    replicaCount: 2
    servers:
      - zones:
          - zone: .
            scheme: dns://
            use_tcp: true
        port: 53
        plugins:
          - name: errors
          - name: health
            configBlock: |-
              lameduck 5s
          - name: ready
          - name: kubernetes
            parameters: cluster.local in-addr.arpa ip6.arpa
            configBlock: |-
              pods verified
              fallthrough in-addr.arpa ip6.arpa
          - name: autopath
            parameters: "@kubernetes"
          - name: forward
            parameters: . /etc/resolv.conf
          - name: cache
            configBlock: |-
              prefetch 20
              serve_stale
          - name: loop
          - name: reload
          - name: loadbalance
          - name: prometheus
            parameters: 0.0.0.0:9153
          - name: log
            configBlock: |-
              class error
      # In-cluster resolution of the LAN-only app zone.
      #
      # The `.` block above forwards everything it does not know to the node's
      # resolvers, and those know nothing about *.${SECRET_DOMAIN}: by design those
      # names have no public record, so every in-cluster client got NXDOMAIN for
      # registry./gitlab.${SECRET_DOMAIN}. That silently breaks anything running INSIDE
      # the cluster that talks to an app by its real hostname — CI job pods pushing to
      # the zot registry, and the GitLab runner registering against
      # https://gitlab.${SECRET_DOMAIN}.
      #
      # k8s-gateway is already this zone's resolver on the LAN: it watches HTTPRoute
      # and answers each hostname with the matching gateway IP. Pointing the cluster
      # resolver at it fixes every current and future LAN-only app in one place rather
      # than one hosts entry per app. UDP only — the k8s-gateway Service publishes no
      # TCP/53, so `use_tcp` must stay off here or every query fails.
      - zones:
          - zone: ${SECRET_DOMAIN}
        port: 53
        plugins:
          - name: errors
          - name: forward
            parameters: . 192.168.1.161
          - name: cache
            configBlock: |-
              prefetch 20
              serve_stale
          - name: reload
          - name: loadbalance
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

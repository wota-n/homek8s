---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radarr
spec:
  chartRef:
    kind: OCIRepository
    name: radarr
  interval: 1h
  values:
    controllers:
      radarr:
        strategy: Recreate
        containers:
          app:
            image:
              repository: docker.io/linuxserver/radarr
              tag: 5.14.0
            # Talos cannot fix. Radarr 5.14.0's s6 run script hardcodes
            # `s6-setuidgid abc`, which calls setgroups(); Talos denies that
            # syscall, the service dies with exitcode 111, and nothing binds
            # 7878. Sonarr/Prowlarr/qBittorrent ship a run script that BRANCHES
            # on LSIO_NON_ROOT_USER and skips the group switch — Radarr's does
            # not, so no env var can save it.
            # Proven in-cluster: running the binary directly as the container
            # user returns {"status":"OK"} on /ping, so the app and volume are
            # fine and only the s6 wrapper is broken. Run it as uid 1000 via
            # runAsUser + PUID/PGID, which is exactly what the working apps do.
            command:
              - /bin/sh
              - -c
              - exec /app/radarr/bin/Radarr -nobrowser -data=/config
            env:
              PUID: "1000"
              PGID: "1000"
            envFrom:
              - secretRef:
                  name: radarr
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
    service:
      app:
        ports:
          http:
            port: 7878
    ingress:
      main:
        enabled: false
    persistence:
      config:
        enabled: true
        type: persistentVolumeClaim
        storageClass: local-path
        accessMode: ReadWriteOnce
        size: 1Gi
      # Same claim as Sonarr — same uid, same filesystem, hardlinks intact.
      media:
        enabled: true
        type: persistentVolumeClaim
        existingClaim: media-data
        globalMounts:
          - path: /data

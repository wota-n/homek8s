---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radarr
spec:
  chartRef:
    kind: OCIRepository
    name: radarr
  interval: 1h
  values:
    controllers:
      radarr:
        strategy: Recreate
        containers:
          app:
            image:
              repository: docker.io/linuxserver/radarr
              tag: 5.14.0
            env:
              PUID: "1000"
              PGID: "1000"
              # REQUIRED on Talos. Radarr's s6 run script is:
              #   exec s6-setuidgid abc /app/radarr/bin/Radarr
              # unconditionally — unlike Sonarr's, which has an
              # LSIO_NON_ROOT_USER branch. s6-setuidgid calls setgroups(),
              # which Talos denies, so the service loops forever on
              # "unable to set supplementary group list" and Radarr never
              # starts. The pod still reports READY because the chart defines
              # no probe. Setting this takes the non-root path, and the app
              # runs as the container's own uid (1000) via PUID/PGID.
              LSIO_NON_ROOT_USER: "true"
            envFrom:
              - secretRef:
                  name: radarr
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
    service:
      app:
        ports:
          http:
            port: 7878
    ingress:
      main:
        enabled: false
    persistence:
      config:
        enabled: true
        type: persistentVolumeClaim
        storageClass: local-path
        accessMode: ReadWriteOnce
        size: 1Gi
      # Same claim as Sonarr — same uid, same filesystem, hardlinks intact.
      media:
        enabled: true
        type: persistentVolumeClaim
        existingClaim: media-data
        globalMounts:
          - path: /data

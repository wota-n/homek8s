---
# Radarr auth. REQUIRED = ForLocalAddresses keeps the login form off the LAN
# (i.e. only reachable over Tailscale).
#
# REQUIRED Bitwarden keys (project behind ClusterSecretStore 'bitwarden-login'):
#   RADARR__AUTH__REQUIRED
#   RADARR__AUTH__METHOD
#   RADARR__AUTH__USERNAME
#   RADARR__AUTH__PASSWORD
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: radarr
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-login
    kind: ClusterSecretStore
  target:
    name: radarr
    creationPolicy: Owner
  data:
    - secretKey: RADARR__AUTH__REQUIRED
      remoteRef:
        key: RADARR__AUTH__REQUIRED
    - secretKey: RADARR__AUTH__METHOD
      remoteRef:
        key: RADARR__AUTH__METHOD
    - secretKey: RADARR__AUTH__USERNAME
      remoteRef:
        key: RADARR__AUTH__USERNAME
    - secretKey: RADARR__AUTH__PASSWORD
      remoteRef:
        key: RADARR__AUTH__PASSWORD

---
# Radarr auth. REQUIRED = ForLocalAddresses keeps the login form off the LAN
# (i.e. only reachable over Tailscale). All FIVE keys are needed: _ENABLED is
# the gate, and without it the other four are ignored and config.xml has no
# <Username>/<Password> at all.
#
# REQUIRED Bitwarden keys (project behind ClusterSecretStore 'bitwarden-login'):
#   RADARR__AUTH__ENABLED        true
#   RADARR__AUTH__REQUIRED       ForLocalAddresses
#   RADARR__AUTH__METHOD         Forms
#   RADARR__AUTH__USERNAME
#   RADARR__AUTH__PASSWORD
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: radarr
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-login
    kind: ClusterSecretStore
  target:
    name: radarr
    creationPolicy: Owner
  data:
    - secretKey: RADARR__AUTH__ENABLED
      remoteRef:
        key: RADARR__AUTH__ENABLED
    - secretKey: RADARR__AUTH__REQUIRED
      remoteRef:
        key: RADARR__AUTH__REQUIRED
    - secretKey: RADARR__AUTH__METHOD
      remoteRef:
        key: RADARR__AUTH__METHOD
    - secretKey: RADARR__AUTH__USERNAME
      remoteRef:
        key: RADARR__AUTH__USERNAME
    - secretKey: RADARR__AUTH__PASSWORD
      remoteRef:
        key: RADARR__AUTH__PASSWORD

---
# Jellyfin admin credentials. Jellyfin is the ONE app in this stack designed
# for multiple users — family get their own accounts created inside Jellyfin
# (Dashboard > Users), never here. The *arrs have no user concept at all: their
# Forms auth is a single admin login with full rights, so don't share those.
#
# REQUIRED Bitwarden keys (project behind ClusterSecretStore 'bitwarden-login'):
#   JELLYFIN_ADMIN_USER
#   JELLYFIN_ADMIN_PASSWORD
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jellyfin
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-login
    kind: ClusterSecretStore
  target:
    name: jellyfin
    creationPolicy: Owner
  data:
    - secretKey: JELLYFIN_ADMIN_USER
      remoteRef:
        key: JELLYFIN_ADMIN_USER
    - secretKey: JELLYFIN_ADMIN_PASSWORD
      remoteRef:
        key: JELLYFIN_ADMIN_PASSWORD

---
# LAN access to Jellyfin via envoy-internal.
#
# This is the WORKING path today. The Tailscale VIP route is configured but not
# serving (see references/tailscale-operator.md in the homek8s-cluster-ops skill
# — /etc/proxies/serve-config.json is never generated, with no operator error to
# explain it). Keep this route: it costs nothing and it means Jellyfin is usable
# from the sofa right now.
#
# Deliberately envoy-INTERNAL, never envoy-external: streaming video through
# Cloudflare Tunnel violates their CDN terms of service.
#
# `${SECRET_DOMAIN}` resolves because this app's ks.yaml sets
# postBuild.substituteFrom: cluster-secrets.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin
spec:
  hostnames:
    - "jellyfin.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: jellyfin
          port: 8096

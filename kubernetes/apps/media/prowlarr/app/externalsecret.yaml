---
# Prowlarr auth. Without this the WebUI is open to anything on the LAN, which
# on a *arr means anyone can add an indexer and redirect your downloads.
#
# REQUIRED Bitwarden keys (project behind ClusterSecretStore 'bitwarden-login'):
#   PROWLARR__AUTH__REQUIRED
#   PROWLARR__AUTH__METHOD
#   PROWLARR__AUTH__USERNAME
#   PROWLARR__AUTH__PASSWORD
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prowlarr
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-login
    kind: ClusterSecretStore
  target:
    name: prowlarr
    creationPolicy: Owner
  data:
    - secretKey: PROWLARR__AUTH__REQUIRED
      remoteRef:
        key: PROWLARR__AUTH__REQUIRED
    - secretKey: PROWLARR__AUTH__METHOD
      remoteRef:
        key: PROWLARR__AUTH__METHOD
    - secretKey: PROWLARR__AUTH__USERNAME
      remoteRef:
        key: PROWLARR__AUTH__USERNAME
    - secretKey: PROWLARR__AUTH__PASSWORD
      remoteRef:
        key: PROWLARR__AUTH__PASSWORD

---
# Prowlarr auth. ALL FIVE keys are required — `_ENABLED` is the gate that the
# others depend on. Without it Prowlarr ignores METHOD/REQUIRED/USERNAME/
# PASSWORD entirely: config.xml ends up with no <AuthenticationMethod>,
# <Username> or <Password>, <AuthenticationRequired> falls back to Enabled, and
# the login form can never be satisfied no matter what password is entered.
#
# REQUIRED Bitwarden keys (create in the BSM project 'bitwarden-login' points at):
#   PROWLARR__AUTH__ENABLED      true
#   PROWLARR__AUTH__REQUIRED     ForLocalAddresses
#   PROWLARR__AUTH__METHOD       Forms
#   PROWLARR__AUTH__USERNAME
#   PROWLARR__AUTH__PASSWORD
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prowlarr
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-login
    kind: ClusterSecretStore
  target:
    name: prowlarr
    creationPolicy: Owner
  data:
    - secretKey: PROWLARR__AUTH__ENABLED
      remoteRef:
        key: PROWLARR__AUTH__ENABLED
    - secretKey: PROWLARR__AUTH__REQUIRED
      remoteRef:
        key: PROWLARR__AUTH__REQUIRED
    - secretKey: PROWLARR__AUTH__METHOD
      remoteRef:
        key: PROWLARR__AUTH__METHOD
    - secretKey: PROWLARR__AUTH__USERNAME
      remoteRef:
        key: PROWLARR__AUTH__USERNAME
    - secretKey: PROWLARR__AUTH__PASSWORD
      remoteRef:
        key: PROWLARR__AUTH__PASSWORD

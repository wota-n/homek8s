---
# Sonarr auth. REQUIRED = ForLocalAddresses means the login form only appears
# for off-LAN clients — which is exactly the Tailscale case. All FIVE keys are
# needed: _ENABLED is the gate, and without it the other four are ignored and
# config.xml has no <Username>/<Password> at all.
#
# REQUIRED Bitwarden keys (project behind ClusterSecretStore 'bitwarden-login'):
#   SONARR__AUTH__ENABLED        true
#   SONARR__AUTH__REQUIRED       ForLocalAddresses
#   SONARR__AUTH__METHOD         Forms
#   SONARR__AUTH__USERNAME
#   SONARR__AUTH__PASSWORD
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sonarr
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-login
    kind: ClusterSecretStore
  target:
    name: sonarr
    creationPolicy: Owner
  data:
    - secretKey: SONARR__AUTH__ENABLED
      remoteRef:
        key: SONARR__AUTH__ENABLED
    - secretKey: SONARR__AUTH__REQUIRED
      remoteRef:
        key: SONARR__AUTH__REQUIRED
    - secretKey: SONARR__AUTH__METHOD
      remoteRef:
        key: SONARR__AUTH__METHOD
    - secretKey: SONARR__AUTH__USERNAME
      remoteRef:
        key: SONARR__AUTH__USERNAME
    - secretKey: SONARR__AUTH__PASSWORD
      remoteRef:
        key: SONARR__AUTH__PASSWORD

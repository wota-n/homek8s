---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarr
spec:
  chartRef:
    kind: OCIRepository
    name: sonarr
  interval: 1h
  values:
    controllers:
      sonarr:
        strategy: Recreate
        containers:
          app:
            image:
              repository: docker.io/linuxserver/sonarr
              tag: 4.0.15
            env:
              PUID: "1000"
              PGID: "1000"
            envFrom:
              - secretRef:
                  name: sonarr
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # fsGroup makes the shared media claim group-writable by 1000, so
        # Sonarr, Radarr, Jellyfin and qBittorrent can all create and hardlink
        # inside /data despite running as different service uids.
        fsGroup: 1000
    service:
      app:
        ports:
          http:
            port: 8989
    ingress:
      main:
        enabled: false
    persistence:
      config:
        enabled: true
        type: persistentVolumeClaim
        storageClass: local-path
        accessMode: ReadWriteOnce
        size: 1Gi
      # The shared library. Same claim as every other app in the stack, which
      # is what makes hardlinks from /data/downloads -> /data/media work.
      media:
        enabled: true
        type: persistentVolumeClaim
        existingClaim: media-data
        globalMounts:
          - path: /data

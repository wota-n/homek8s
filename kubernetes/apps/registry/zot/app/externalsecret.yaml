---
# htpasswd file for zot's HTTP basic auth. The FILE CONTENT is the credential, so it
# lives in Bitwarden only — never in this public repo, never in a chart-rendered Secret.
#
# REQUIRED Bitwarden key (project behind ClusterSecretStore 'bitwarden-login'):
#   ZOT_HTPASSWD
#
# Generate it on your machine (first arg = the username you want to push with):
#   htpasswd -nbB <username> '<password>'
# Paste the WHOLE output line (username:$2y$...) as the key's value.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zot-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-login
    kind: ClusterSecretStore
  target:
    name: zot-auth
    creationPolicy: Owner
  data:
    - secretKey: htpasswd
      remoteRef:
        key: ZOT_HTPASSWD

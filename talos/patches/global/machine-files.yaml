machine:
  files:
    - op: create
      path: /etc/cri/conf.d/20-customization.part
      content: |
        [plugins."io.containerd.cri.v1.images"]
          discard_unpacked_layers = false
        [plugins."io.containerd.cri.v1.runtime"]
          device_ownership_from_security_context = true

# NOTE: do NOT add a /etc/hosts entry here. Talos owns /etc/hosts and
# regenerates it (it holds the auto-populated node hostname entry), so a static
# file here gets clobbered — and an unspecified `permissions` silently renders
# 0o0, an unreadable /etc/hosts. Use `kind: StaticHostConfig` in
# ../../registry-static-hostcfg.yaml instead, which Talos MERGES into the file.
